---
name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true # zizmor: ignore[artipacked] credentials needed to push the moved major tag

      - name: Validate tag
        id: validate
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping non-semver tag: $GITHUB_REF_NAME"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Move major version tag
        if: steps.validate.outputs.valid == 'true'
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          latest="$(git tag -l "${major}.[0-9]*.[0-9]*" --sort=-v:refname | head -n1)"
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest $major release ($latest is); leaving $major tag alone"
            exit 0
          fi
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push origin "$major" --force
