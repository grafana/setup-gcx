name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version:
          - latest
          # renovate: datasource=github-releases depName=grafana/gcx
          - v1.3.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - id: setup
        uses: ./ # zizmor: ignore[self-repository] testing the local action in-tree
        with:
          version: ${{ matrix.version }}

      - name: gcx is on PATH and runs
        shell: bash
        run: gcx version

      - name: outputs are populated
        shell: bash
        env:
          GCX_VERSION: ${{ steps.setup.outputs.version }}
          GCX_PATH: ${{ steps.setup.outputs.path }}
        run: |
          echo "resolved version: $GCX_VERSION"
          echo "binary path:      $GCX_PATH"
          test -n "$GCX_VERSION"
          test -x "$GCX_PATH"
