---
name: Setup gcx
description: Install the gcx CLI and add it to PATH
author: Grafana Labs
branding:
  icon: download
  color: orange
inputs:
  version:
    description: 'gcx version to install (e.g. v1.3.0) or "latest"'
    required: false
    default: latest
  github-token:
    description: Token used for GitHub API calls (release lookup) to avoid rate limits
    required: false
    default: ${{ github.token }}
outputs:
  version:
    description: The resolved gcx version that was installed
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed gcx binary
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      # working-directory resolves ${{ github.action_path }} natively, so the Go
      # module (go.mod + main.go) is the working dir and `go run .` compiles it.
      # GitHub-hosted Linux, macOS, and Windows runners all ship a Go toolchain.
      working-directory: ${{ github.action_path }}
      run: go run .
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
