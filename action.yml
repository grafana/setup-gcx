---
name: Setup gcx
description: Install the gcx CLI and add it to PATH
author: Grafana Labs
branding:
  icon: download
  color: orange
inputs:
  version:
    description: 'gcx version to install (e.g. v1.3.0) or "latest"'
    required: false
    default: latest
  github-token:
    description: Token used for GitHub API calls (release lookup) to avoid rate limits
    required: false
    default: ${{ github.token }}
outputs:
  version:
    description: The resolved gcx version that was installed
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed gcx binary
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      # Reference $GITHUB_ACTION_PATH (a runtime env var) rather than the ${{ github.action_path }} template.
      # On Windows the template bakes a backslash path into the script literal and bash eats the backslashes.
      # Prefer python3, falling back to python (Windows runners expose the interpreter as `python`).
      run: |
        if command -v python3 >/dev/null 2>&1; then
          python3 "$GITHUB_ACTION_PATH/install.py"
        else
          python "$GITHUB_ACTION_PATH/install.py"
        fi
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
